<!DOCTYPE html>
<html>
<head>
    <title>Task Detail</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Task Detail</h1>

    <h2>{{ task.task }}</h2>

    <p>
        <b>Priority:</b>
        {{ task.priority }}
    </p>

    <p>
        <b>Due Date:</b>
        {{ task.due_date }}
    </p>

    <p>
        <b>Assigned To:</b>
        {{ task.assign }}
    </p>

    <br>

    <a href="/">Back</a>

</body>
</html>
